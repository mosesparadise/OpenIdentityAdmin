name: Inspect pilot replay mutation witness
on:
  push:
    branches: [136-catalogue-provider-validation]
permissions:
  contents: read
jobs:
  pilot-replay-mutations:
    name: Pilot replay mutations ${{ matrix.provider }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [PostgreSql]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'
      - run: dotnet restore --locked-mode
      - run: python3 scripts/test_mutations.py
      - run: python3 scripts/test_pilot_witness_receipt.py
      - name: Prepare pinned native database image
        run: python3 scripts/prepare_native_image.py ${{ matrix.provider }}
      - name: Trust local HTTPS certificate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/identity-https-trust"
          dotnet dev-certs https --export-path "$RUNNER_TEMP/identity-https-trust/localhost.pem" --format PEM
          openssl rehash "$RUNNER_TEMP/identity-https-trust"
          echo "SSL_CERT_DIR=$RUNNER_TEMP/identity-https-trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
      - name: Verify isolated pilot replay critical-decision mutants
        run: python3 scripts/verify_mutations.py ${{ matrix.provider }} --suite pilot-replay --disposable-checkout
      - name: Retain only sanitized mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-replay-mutations-${{ matrix.provider }}
          path: artifacts/mutations/pilot-replay-${{ matrix.provider }}/*.json
          retention-days: 7
          if-no-files-found: error
