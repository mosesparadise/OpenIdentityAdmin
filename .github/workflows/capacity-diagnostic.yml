name: T030 focused cancellation diagnostic
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: capacity-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    if: github.head_ref == '009-interaction-capacity'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build tests/aspire/IdentityPlatform.Issuer.Tests --no-restore --nologo
      - name: Trust local HTTPS certificate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/identity-https-trust"
          dotnet dev-certs https --export-path "$RUNNER_TEMP/identity-https-trust/localhost.pem" --format PEM
          openssl rehash "$RUNNER_TEMP/identity-https-trust"
          echo "SSL_CERT_DIR=$RUNNER_TEMP/identity-https-trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
      - name: Observe one blocked SQL cancellation without changing acceptance
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from verify_mutations import run
          from test_evidence import require_complete_trx
          output = Path('artifacts/capacity-diagnostic').resolve()
          output.mkdir(parents=True)
          report = output / 'cancellation.trx'
          expression = 'Provider=SqlServer&FullyQualifiedName~Waiting_admission_cancels_without_writes_while_an_independent_budget_progresses'
          code, _ = run(['dotnet', 'test', '--project', 'tests/aspire/IdentityPlatform.Issuer.Tests', '--no-build', '--no-restore', '--no-progress', '--filter', expression, '--report-trx', '--report-trx-filename', report.name, '--results-directory', str(output)], 180, os.environ.copy())
          if report.exists():
              for node in ET.parse(report).getroot().findall('.//{*}ErrorInfo/{*}Message'):
                  message = (node.text or '').strip()
                  if re.fullmatch(r'Unexpected cancellation outcome: sql count=\d+, inner=(True|False); (number=-?\d+, state=\d+, class=\d+, line=\d+, emptyProcedure=(True|False), kind=(attention|severe|statement-terminated|other)(; )?){1,8}', message):
                      print(message, flush=True)
          require_complete_trx(report, expected_count=1)
          if code:
              raise RuntimeError('Focused cancellation process did not succeed')
          print('Focused cancellation: one passing case, no skipped result; separate diagnostic only')
          PY
      - name: Retain separate synthetic diagnostic report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capacity-cancellation-diagnostic
          path: artifacts/capacity-diagnostic/
          retention-days: 7
          if-no-files-found: error
