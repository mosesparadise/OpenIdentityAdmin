name: Observe one Firefox error document
on:
  push:
    branches: [056-history-navigation-boundary]
permissions:
  contents: read
concurrency:
  group: history-document-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Reject repeated attempts
        run: python3 scripts/observe_history_navigation.py --check-launch
      - name: Verify seeded receipt and launch controls
        run: |
          python3 scripts/test_history_navigation_observation.py
          python3 scripts/test_history_document_observation.py
          node scripts/test_history_document_projection.mjs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --nologo
      - name: Verify bounded read and cleanup ownership without a browser
        run: dotnet test --project tests/aspire/IdentityPlatform.Administrator.Tests/IdentityPlatform.Administrator.Tests.csproj --no-build --no-restore --minimum-expected-tests 8 --filter 'FullyQualifiedName~HistoryDocumentReadTests'
      - name: Install only pinned Firefox and synthetic profile trust tooling
        run: |
          dotnet run --project tests/tooling/IdentityPlatform.BrowserInstaller --no-build -- install --with-deps firefox
          sudo apt-get install -y libnss3-tools
          mkdir -p "$RUNNER_TEMP/native-history-trust"
          dotnet dev-certs https --export-path "$RUNNER_TEMP/native-history-trust/localhost.pem" --format PEM
          echo "IDENTITY_TEST_CERTIFICATE=$RUNNER_TEMP/native-history-trust/localhost.pem" >> "$GITHUB_ENV"
      - name: Observe exactly one synthetic history control
        run: python3 scripts/observe_history_navigation.py
      - name: Preserve the original result with bounded passive evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-document-observation
          path: |
            artifacts/history-document-observation/observation.trx
            artifacts/history-document-observation/receipt.json
          if-no-files-found: error
          retention-days: 7
