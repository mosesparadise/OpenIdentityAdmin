name: Bounded theme subtree diagnostic
on:
  push:
    branches: [144-theme-subtree-diagnostic]
permissions:
  contents: read
concurrency:
  group: theme-subtree-${{ github.ref }}
  cancel-in-progress: false
jobs:
  theme-subtree:
    name: Synthetic WebKit theme ownership comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.x'
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --nologo
      - run: sudo python3 scripts/prepare_browser_archive.py
      - run: dotnet run --project tests/tooling/IdentityPlatform.BrowserInstaller --no-build -- install --with-deps webkit
      - run: python3 scripts/run_theme_subtree.py
      - name: Preserve original diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: theme-subtree-diagnostic
          path: artifacts/theme-subtree/
          retention-days: 7
          if-no-files-found: error
